[project]
name = "unica-attention"
version = "0.1.0b2"
description = "Attention kernel made for one GPU: RTX 5080 (sm_120)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["attention", "cuda", "blackwell", "sm_120", "rtx-5080", "fp4", "int8", "comfyui", "wan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# the kernels need a CUDA build of torch; any version runs, 2.14 is the tested one (unica.compatibility() says so)
dependencies = ["torch"]

[project.urls]
Repository = "https://github.com/k1n0F/UnicaAttention"
Log = "https://github.com/k1n0F/UnicaAttention/blob/main/LOG.md"
Benchmarks = "https://rigsy.dev/bench"

[dependency-groups]
bench = [
    "torch==2.14.0",  # the SageAttention wheels are built against this ABI
    "triton-windows==3.7.0.post26; sys_platform == 'win32'",  # SageAttention 2 imports triton
]

[tool.uv]
default-groups = ["bench"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # fixed, so a newer ruff's defaults do not change what is checked
ignore = ["C408"]  # dict(qk="int8") presets read like the keyword arguments they become

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unica"
module-root = ""

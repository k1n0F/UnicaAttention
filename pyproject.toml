[project]
name = "unica-attention"
version = "0.0.0"
description = "Attention kernel made for one GPU: RTX 5080 (sm_120)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
bench = [
    "torch==2.14.0",  # the SageAttention wheels are built against this ABI
    "triton-windows==3.7.0.post26; sys_platform == 'win32'",  # SageAttention 2 imports triton
]

[tool.uv]
default-groups = ["bench"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408"]  # dict(qk="int8") presets read like the keyword arguments they become

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unica"
module-root = ""
